<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sistem Informasi Data SMP Angkasa (SIDSA)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    let currentSession = JSON.parse(localStorage.getItem('sidsa_session_v10'));
    
    // Validasi sesi ketat: pastikan role dan identitas valid
    if (!currentSession || !currentSession.role || !currentSession.user) {
      alert("Sesi Anda telah berakhir atau belum login. Silakan masuk kembali.");
      window.location.href = 'login.html';
    }

    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              blue: '#0052cc',
              blueDark: '#003d99',
              blueLight: '#e6f0ff',
              orange: '#ffab00',
              grayBg: '#f8fafc'
            }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-brand-grayBg font-sans text-slate-800 antialiased min-h-screen flex flex-col">

  <!-- TOP HEADER -->
  <header class="bg-gradient-to-r from-blue-900 via-brand-blue to-blue-800 text-white shadow-lg sticky top-0 z-50 print:hidden border-b border-blue-700/50">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex flex-wrap items-center justify-between gap-4">
      <div class="flex items-center space-x-3.5">
        <div class="flex items-center space-x-2 bg-white/10 p-1.5 rounded-xl border border-white/25 backdrop-blur-md shadow-inner">
          <img src="LOGO YASARINI_PNG.png" alt="Logo Yasarini" onerror="this.src='https://via.placeholder.com/40?text=YSR'" class="w-10 h-10 object-contain rounded-lg bg-white p-0.5 shadow">
          <img src="5. SMP.png" alt="Logo SMP Angkasa" onerror="this.src='https://via.placeholder.com/40?text=SMP'" class="w-10 h-10 object-contain rounded-lg bg-white p-0.5 shadow">
        </div>
        <div>
          <h1 class="font-black text-base lg:text-lg leading-tight tracking-wide flex items-center gap-1.5">
            SIDSA
          </h1>
          <p class="text-xs text-blue-100 font-medium">Sistem Informasi Data SMP Angkasa</p>
        </div>
      </div>
      <div class="flex items-center gap-3" id="topHeaderRightControls"></div>
    </div>
  </header>

  <div class="flex flex-1 max-w-7xl w-full mx-auto px-4 py-6 gap-6">
    <!-- SIDEBAR NAVIGATION -->
    <aside class="w-64 bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 shrink-0 hidden md:block print:hidden">
      <div class="mb-4 px-2 text-xs font-bold text-slate-400 uppercase tracking-wider">Menu Utama</div>
      <nav class="space-y-1.5" id="sidebarMenu"></nav>
    </aside>

    <!-- MAIN CONTENT AREA -->
    <main class="flex-1 space-y-6 overflow-hidden">
      <div id="mainTopFilterCard" class="bg-white rounded-2xl p-4 shadow-sm border border-slate-200/80 flex flex-wrap items-center justify-between gap-4 print:hidden">
        <div class="flex flex-wrap items-center gap-3" id="filterControlsContainer"></div>
        <div class="flex items-center gap-2">
          <button onclick="exportToExcel()" class="flex items-center gap-1.5 bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 px-3.5 rounded-xl shadow-sm transition">
            <i data-lucide="file-spreadsheet" class="w-4 h-4"></i> Excel
          </button>
          <button onclick="window.print()" class="flex items-center gap-1.5 bg-slate-700 hover:bg-slate-800 text-white text-xs font-bold py-2 px-3.5 rounded-xl shadow-sm transition">
            <i data-lucide="printer" class="w-4 h-4"></i> Cetak / PDF
          </button>
        </div>
      </div>

      <!-- SEARCH BAR KHUSUS ADMIN & PIMPINAN -->
      <div id="adminSearchContainer" class="hidden print:hidden bg-white p-3.5 rounded-2xl border border-slate-200/80 shadow-sm flex items-center gap-3">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 top-3"></i>
          <input type="text" id="globalSchoolSearchInput" oninput="handleGlobalSearch(this.value)" placeholder="Cari berdasarkan nama sekolah atau NPSN..." class="w-full pl-9 pr-4 py-2 border border-slate-200 rounded-xl text-xs outline-none focus:ring-2 focus:ring-brand-blue font-medium bg-slate-50/50">
        </div>
        <button onclick="clearGlobalSearch()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 text-xs font-bold px-3 py-2 rounded-xl transition">Reset</button>
      </div>

      <div id="pageContent"></div>
    </main>
  </div>

  <!-- MODAL MANAJEMEN AKUN SEKOLAH -->
  <div id="manageUsersModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 print:hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-6 space-y-4 border border-slate-200 flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h3 class="font-bold text-slate-800 text-base flex items-center gap-2">
            <i data-lucide="users-round" class="w-5 h-5 text-brand-blue"></i> Manajemen Akun Sekolah Terdaftar
          </h3>
          <p class="text-xs text-slate-500 mt-0.5">Kelola akun mandiri yang telah terdaftar di sistem.</p>
        </div>
        <button onclick="closeManageUsersModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div class="flex-1 overflow-y-auto min-h-[250px]">
        <table class="w-full text-left text-xs border-collapse">
          <thead>
            <tr class="bg-slate-100 font-bold border-b text-slate-700">
              <th class="p-2.5">No</th>
              <th class="p-2.5">Nama Sekolah</th>
              <th class="p-2.5">NPSN (Username)</th>
              <th class="p-2.5">Lanud</th>
              <th class="p-2.5 text-center">Aksi</th>
            </tr>
          </thead>
          <tbody id="manageUsersTableBody" class="divide-y divide-slate-100 font-medium"></tbody>
        </table>
      </div>
      <div class="text-right border-t pt-3">
        <button onclick="closeManageUsersModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <!-- MODAL PREVIEW DOKUMEN -->
  <div id="previewDocModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 print:hidden">
    <div class="bg-white rounded-2xl shadow-2xl max-w-4xl w-full p-6 space-y-4 border border-slate-200 flex flex-col max-h-[90vh]">
      <div class="flex justify-between items-center border-b pb-3">
        <div>
          <h3 id="docModalTitle" class="font-bold text-slate-800 text-base flex items-center gap-2">
            <i data-lucide="file-text" class="w-5 h-5 text-brand-blue"></i> Preview Berkas Dokumen
          </h3>
          <p id="docModalSubtitle" class="text-xs text-slate-500 mt-0.5"></p>
        </div>
        <button onclick="closePreviewDocModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-6 h-6"></i></button>
      </div>
      <div id="docModalBody" class="flex-1 bg-slate-100 rounded-xl p-4 overflow-y-auto min-h-[300px] flex items-center justify-center border border-slate-200"></div>
      <div class="flex justify-between items-center border-t pt-3 text-xs">
        <span class="text-slate-400 font-medium">SIDSA File Viewer Mode</span>
        <div class="flex items-center gap-2">
          <button id="docModalDownloadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-xl shadow-sm flex items-center gap-1.5">
            <i data-lucide="download" class="w-4 h-4"></i> Unduh File Berkas
          </button>
          <button onclick="closePreviewDocModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl">Tutup</button>
        </div>
      </div>
    </div>
  </div>

  <!-- MODAL TAMBAH TAHUN AJARAN BARU -->
  <div id="addTaModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 print:hidden">
    <div class="bg-white rounded-2xl shadow-xl max-w-sm w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 class="font-bold text-slate-800 text-sm flex items-center gap-1.5">
          <i data-lucide="calendar-plus" class="w-4 h-4 text-brand-blue"></i> Tambah Tahun Ajaran Baru
        </h3>
        <button onclick="closeAddTaModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <form onsubmit="handleAddNewTA(event)" class="space-y-4 text-xs">
        <div>
          <label class="block font-bold text-slate-600 mb-1">Tahun Ajaran Baru</label>
          <input type="text" id="newTaInput" required placeholder="Contoh: 2026-2027" class="w-full p-2.5 border border-slate-300 rounded-xl outline-none focus:ring-2 focus:ring-brand-blue font-semibold">
        </div>
        <div class="flex justify-end gap-2 border-t pt-3">
          <button type="button" onclick="closeAddTaModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-3 py-2 rounded-xl">Batal</button>
          <button type="submit" class="bg-brand-blue hover:bg-brand-blueDark text-white font-bold px-4 py-2 rounded-xl shadow-sm">Tambah</button>
        </div>
      </form>
    </div>
  </div>

  <!-- MODAL DETAIL ISIAN SEKOLAH -->
  <div id="detailModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 print:hidden">
    <div class="bg-white rounded-2xl shadow-xl max-w-2xl w-full p-6 space-y-4 border border-slate-200">
      <div class="flex justify-between items-center border-b pb-3">
        <h3 id="modalTitle" class="font-bold text-slate-800 text-base">Detail Ringkasan Input Data Sekolah</h3>
        <button onclick="closeDetailModal()" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div id="modalBody" class="text-xs space-y-3 max-h-96 overflow-y-auto"></div>
      <div class="text-right border-t pt-3">
        <button onclick="closeDetailModal()" class="bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-4 py-2 rounded-xl text-xs">Tutup</button>
      </div>
    </div>
  </div>

  <script>
    // URL WEB APP GOOGLE APPS SCRIPT DATABASE
    const GOOGLE_SHEET_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbyK1X4If9XPwXeSzNig4bvCTOS8iNsb5LuNmqwVYTqoSckVSr6ozMOqDBYfJklIZwvpLA/exec";

    // Fungsi Sinkronisasi Realtime dengan Metode Upsert (Kirim nama modul spesifik agar terbuat tab terpisah)
    function syncToGoogleSheet(schoolObj, tahunAjaranStr, moduleName) {
      if (!schoolObj) return;

      const payload = {
        tahunAjaran: tahunAjaranStr,
        npsn: schoolObj.npsn,
        namaSekolah: schoolObj.nama,
        cabang: schoolObj.cabang,
        alamatSekolah: schoolObj.alamatSekolah,
        kepalaSekolah: schoolObj.kepalaSekolah,
        akreditasi: schoolObj.akreditasi,
        tahunAkreditasi: schoolObj.tahunAkreditasi,
        siswa: schoolObj.siswa,
        pendidik: schoolObj.pendidik,
        tendik: schoolObj.tendik,
        legalitas: schoolObj.legalitas,
        keuangan: schoolObj.keuangan,
        dokumenLaporan: schoolObj.dokumenLaporan,
        updatedModule: moduleName || "Data Umum"
      };

      fetch(GOOGLE_SHEET_WEB_APP_URL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      })
      .then(() => {
        console.log("Data modul [" + moduleName + "] berhasil disinkronkan ke Google Sheet.");
      })
      .catch(err => {
        console.error("Gagal sinkronisasi Google Sheet:", err);
      });
    }

    const TOTAL_SMP_ANGKASA = 15;
    let globalSearchKeyword = "";

    const docsConfig = [
      { key: 'rkas', label: 'RKAS' },
      { key: 'rpss', label: 'Sumber Dana RPSS (Hasil Recon Bendahara Pusat)' },
      { key: 'raporPendidikan', label: 'Rapor Pendidikan Sekolah' },
      { key: 'mpls', label: 'Hasil Laporan MPLS' },
      { key: 'kaldik', label: 'Kalender Pendidikan Sekolah' },
      { key: 'sarpras', label: 'Data Sarana dan Prasarana' },
      { key: 'medsos', label: 'Laporan Perkembangan Media Sosial' },
      { key: 'jadwalPelajaran', label: 'Jadwal Pelajaran' },
      { key: 'skPembagianTugas', label: 'SK Pembagian Tugas' }
    ];

    function createDefaultSchoolObject(npsn, nama, cabang) {
      let defaultNama = nama;
      if (!defaultNama || defaultNama.includes("ADMIN") || defaultNama.toLowerCase().includes("test")) {
        defaultNama = "NAMA SEKOLAH BELUM DIISI";
      }

      return {
        npsn: npsn || "-",
        nama: defaultNama,
        cabang: cabang || "-",
        alamatSekolah: "",
        akreditasi: "Belum",
        tahunAkreditasi: "",
        kepalaSekolah: "",
        statusValidation: "Sesuai",
        lastUpdate: new Date().toLocaleString('id-ID'),
        lastUpdateIdentitas: "",
        lastUpdateSiswa: "",
        lastUpdatePendidik: "",
        lastUpdateKeuangan: "",
        lastUpdateDokumen: "",
        hasDataRevision: false,
        lastUpdatedModule: "",
        legalitas: { 
          skPendirian: "-", tglSK: "-", fileSKPendirian: "", statusSKPendirian: "Belum Diisi", notesSKPendirian: "",
          skIzin: "-", tglSKIzin: "", fileSKIzin: "", statusSKIzin: "Belum Diisi", notesSKIzin: "",
          fileAkreditasi: "", statusAkreditasi: "Belum Diisi", notesAkreditasi: ""
        },
        siswa: { k7L: 0, k7P: 0, r7: 0, k8L: 0, k8P: 0, r8: 0, k9L: 0, k9P: 0, r9: 0 },
        pendidik: { L: 0, P: 0, gty: 0, cgty: 0, dpkPns: 0 },
        tendik: { L: 0, P: 0, kty: 0, ckty: 0, dpkPns: 0 },
        keuangan: {
          dopUmum7: 0, dopUmum8: 0, dopUmum9: 0, dopUmumThn7: 0, dopUmumThn8: 0, dopUmumThn9: 0, siswaUmum7: 0, siswaUmum8: 0, siswaUmum9: 0,
          dopTniau7: 0, dopTniau8: 0, dopTniau9: 0, dopTniauThn7: 0, dopTniauThn8: 0, dopTniauThn9: 0, siswaTniau7: 0, siswaTniau8: 0, siswaTniau9: 0,
          dopLainnyaList: [], rpssSumber01: 0, rpssSumber02: 0, rpssSumber03: 0,
          dspGel1: 0, dspSiswa1: 0, dspGel2: 0, dspSiswa2: 0, dspGel3: 0, dspSiswa3: 0, dspLainnyaList: []
        },
        dokumenLaporan: {
          rkas: { status: "Belum Mengisi", notes: "", fileName: "" },
          rpss: { status: "Belum Mengisi", notes: "", fileName: "" },
          raporPendidikan: { status: "Belum Mengisi", notes: "", fileName: "" },
          mpls: { status: "Belum Mengisi", notes: "", fileName: "" },
          kaldik: { status: "Belum Mengisi", notes: "", fileName: "" },
          sarpras: { status: "Belum Mengisi", notes: "", fileName: "" },
          medsos: { status: "Belum Mengisi", notes: "", fileName: "" },
          jadwalPelajaran: { status: "Belum Mengisi", notes: "", fileName: "" },
          skPembagianTugas: { status: "Belum Mengisi", notes: "", fileName: "" }
        }
      };
    }

    let activeTab = 'dashboard';
    let db = JSON.parse(localStorage.getItem('sidsa_db_v10')) || {};
    if (!db || typeof db !== 'object') db = {};

    if (currentSession.role === 'SEKOLAH') {
      const taList = Object.keys(db);
      if (taList.length === 0) {
        db["2026-2027"] = [createDefaultSchoolObject(currentSession.npsn || currentSession.user, currentSession.nama, currentSession.cabang)];
      } else {
        taList.forEach(ta => {
          if (!Array.isArray(db[ta])) db[ta] = [];
          let exists = db[ta].find(s => s.npsn === currentSession.npsn || s.npsn === currentSession.user);
          if (!exists) {
            db[ta].push(createDefaultSchoolObject(currentSession.npsn || currentSession.user, currentSession.nama, currentSession.cabang));
          }
        });
      }
      saveDB();
    }

    function saveDB() {
      localStorage.setItem('sidsa_db_v10', JSON.stringify(db));
    }

    function markSchoolDataUpdated(school, moduleName, moduleKey) {
      const timeStr = new Date().toLocaleString('id-ID');
      school.lastUpdate = timeStr;
      school.hasDataRevision = true;
      school.lastUpdatedModule = moduleName || "Data Sekolah";

      if (moduleKey === 'identitas') school.lastUpdateIdentitas = timeStr;
      if (moduleKey === 'siswa') school.lastUpdateSiswa = timeStr;
      if (moduleKey === 'pendidik') school.lastUpdatePendidik = timeStr;
      if (moduleKey === 'keuangan') school.lastUpdateKeuangan = timeStr;
      if (moduleKey === 'dokumen') school.lastUpdateDokumen = timeStr;

      const taList = Object.keys(db).sort().reverse();
      const currentTA = document.getElementById('filterTA')?.value || taList[0] || "2026-2027";
      
      // Mengirimkan nama modul spesifik agar Google Apps Script membuat tab terpisah
      syncToGoogleSheet(school, currentTA, moduleName);
    }

    function parseRoleInfo() {
      if (currentSession.role === 'SEKOLAH') {
        return { role: 'SEKOLAH', npsn: currentSession.npsn || currentSession.user };
      }
      return { role: currentSession.role, npsn: null };
    }

    function checkSchoolRevisionStatus() {
      const { role, npsn } = parseRoleInfo();
      if (role !== 'SEKOLAH') return { hasIdentitasRev: false, hasDokumenRev: false };

      const taList = Object.keys(db).sort().reverse();
      if (taList.length === 0) return { hasIdentitasRev: false, hasDokumenRev: false };

      const selectedTA = document.getElementById('filterTA')?.value || taList[0];
      const school = db[selectedTA]?.find(s => s.npsn === npsn);
      if (!school) return { hasIdentitasRev: false, hasDokumenRev: false };

      const leg = school.legalitas || {};
      const hasIdentitasRev = (leg.statusAkreditasi === 'Perlu Perbaikan' || leg.statusSKPendirian === 'Perlu Perbaikan' || leg.statusSKIzin === 'Perlu Perbaikan');
      let hasDokumenRev = school.dokumenLaporan ? Object.values(school.dokumenLaporan).some(d => d.status === 'Perlu Perbaikan') : false;

      return { hasIdentitasRev, hasDokumenRev };
    }

    function renderHeaderControls() {
      const container = document.getElementById('topHeaderRightControls');
      const isAdmin = currentSession.role === 'ADMIN';

      let html = '';
      if (isAdmin) {
        html += '<button onclick="openManageUsersModal()" class="text-xs font-semibold bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl border border-emerald-400/30 transition flex items-center gap-1 shadow-sm"><i data-lucide="users-round" class="w-3.5 h-3.5"></i> Manajemen Akun</button>';
      }

      const roleLabel = currentSession.role === 'SEKOLAH' ? 'Sekolah (NPSN: ' + (currentSession.npsn || currentSession.user) + ')' : currentSession.role;

      html += '<div class="bg-blue-950/40 px-3.5 py-1.5 rounded-xl border border-white/10 text-xs flex items-center gap-2.5 backdrop-blur-sm"><i data-lucide="user-check" class="w-4 h-4 text-brand-orange"></i><div><span class="font-bold block">' + currentSession.nama + '</span><span class="text-[10px] text-blue-200 block">' + roleLabel + '</span></div></div>';
      html += '<button onclick="handleLogout()" class="text-xs font-semibold bg-rose-600 hover:bg-rose-700 text-white px-3 py-1.5 rounded-xl transition flex items-center gap-1 shadow-sm"><i data-lucide="log-out" class="w-3.5 h-3.5"></i> Keluar</button>';

      container.innerHTML = html;
    }

    window.onload = function() {
      renderHeaderControls();
      renderSidebar();
      renderFilterControls();
      renderPage('dashboard');
      lucide.createIcons();
    };

    const menuItems = [
      { id: 'dashboard', label: 'Dashboard Utama', icon: 'layout-dashboard', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'identitas', label: 'Identitas & Legalitas', icon: 'school', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'peserta_didik', label: 'Peserta Didik & Rombel', icon: 'users', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pendidik_tendik', label: 'Pendidik & Tendik', icon: 'user-check', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'keuangan', label: 'Data Keuangan', icon: 'wallet', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'dokumen_tambahan', label: 'Dokumen & Laporan', icon: 'file-text', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'analisis', label: 'Analisis & Insight', icon: 'bar-chart-3', roles: ['ADMIN', 'PIMPINAN', 'VIEWER'] },
      { id: 'validasi', label: 'Validasi Data', icon: 'check-square', roles: ['ADMIN'] },
      { id: 'laporan', label: 'Rekap Laporan', icon: 'download', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] },
      { id: 'pengaturan_password', label: 'Ubah Password Akun', icon: 'key-round', roles: ['ADMIN', 'PIMPINAN', 'SEKOLAH', 'VIEWER'] }
    ];

    function renderSidebar() {
      const container = document.getElementById('sidebarMenu');
      container.innerHTML = '';
      const { role } = parseRoleInfo();
      const revStatus = checkSchoolRevisionStatus();

      menuItems.forEach(item => {
        if (item.roles.includes(role)) {
          const isActive = activeTab === item.id;
          const btn = document.createElement('button');
          btn.onclick = () => { activeTab = item.id; renderSidebar(); renderPage(item.id); };
          btn.className = 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-xs font-bold transition ' + (isActive ? 'bg-brand-blue text-white shadow-md shadow-brand-blue/20' : 'text-slate-600 hover:bg-slate-100 hover:text-slate-900');
          
          let badgeDot = '';
          if (item.id === 'identitas' && revStatus.hasIdentitasRev) badgeDot = '<span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>';
          if (item.id === 'dokumen_tambahan' && revStatus.hasDokumenRev) badgeDot = '<span class="w-2.5 h-2.5 rounded-full bg-rose-500 animate-pulse"></span>';

          btn.innerHTML = '<div class="flex items-center space-x-3"><i data-lucide="' + item.icon + '" class="w-4 h-4"></i> <span>' + item.label + '</span></div>' + badgeDot;
          container.appendChild(btn);
        }
      });
      lucide.createIcons();
    }

    function handleAddNewTA(e) {

      const taList = Object.keys(db).sort().reverse();

      if (latestTA && db[latestTA].length > 0) {
        db[newTA] = db[latestTA].map(s => createDefaultSchoolObject(s.npsn, s.nama, s.cabang));
      } else {
        db[newTA] = [createDefaultSchoolObject(currentSession.npsn || currentSession.user, currentSession.nama, currentSession.cabang)];

      saveDB();

    function getFilteredData() {
      const taList = Object.keys(db).sort().reverse();
      const taSelect = document.getElementById('filterTA');
      const ta = taSelect?.value || taList[0] || "";
      if (!ta || !db[ta]) return [];

      let list = db[ta] || [];
      const { role, npsn } = parseRoleInfo();

      if (role === 'SEKOLAH') {
        let schoolData = list.find(s => s.npsn === npsn);
        if (!schoolData) {
          schoolData = createDefaultSchoolObject(npsn, currentSession.nama, currentSession.cabang);
          list.push(schoolData);
          saveDB();
        }
        list = [schoolData];
      } else {
        list = list.filter(s => s.npsn !== "PUSAT" && s.npsn !== "-");
      }

      if (globalSearchKeyword && (role === 'ADMIN' || role === 'PIMPINAN')) {
        list = list.filter(s => s.nama.toLowerCase().includes(globalSearchKeyword) || s.npsn.toLowerCase().includes(globalSearchKeyword));
      }

      return list;
    }

    function calcStats(list) {
      let totalSekolah = list.length;
      let totalSiswa = 0, totalRombel = 0, totalPendidik = 0, totalTendik = 0;
      let totalDOPBulan = 0, totalDOPTahunRutin = 0, totalDSPPenerimaan = 0;

      list.forEach(s => {
        const sSiswa = (s.siswa.k7L + s.siswa.k7P) + (s.siswa.k8L + s.siswa.k8P) + (s.siswa.k9L + s.siswa.k9P);
        const sRombel = s.siswa.r7 + s.siswa.r8 + s.siswa.r9;
        const sPendidik = s.pendidik.L + s.pendidik.P;
        const sTendik = s.tendik.L + s.tendik.P;

        const u7 = s.keuangan?.siswaUmum7 ?? (s.siswa.k7L + s.siswa.k7P);
        const u8 = s.keuangan?.siswaUmum8 ?? (s.siswa.k8L + s.siswa.k8P);
        const u9 = s.keuangan?.siswaUmum9 ?? (s.siswa.k9L + s.siswa.k9P);
        const t7 = s.keuangan?.siswaTniau7 ?? 0;
        const t8 = s.keuangan?.siswaTniau8 ?? 0;
        const t9 = s.keuangan?.siswaTniau9 ?? 0;

        const dopBln = (u7 * (s.keuangan?.dopUmum7 || 0)) + (u8 * (s.keuangan?.dopUmum8 || 0)) + (u9 * (s.keuangan?.dopUmum9 || 0))
                     + (t7 * (s.keuangan?.dopTniau7 || 0)) + (t8 * (s.keuangan?.dopTniau8 || 0)) + (t9 * (s.keuangan?.dopTniau9 || 0));
        const dopThn = (u7 * (s.keuangan?.dopUmumThn7 || 0)) + (u8 * (s.keuangan?.dopUmumThn8 || 0)) + (u9 * (s.keuangan?.dopUmumThn9 || 0))
                     + (t7 * (s.keuangan?.dopTniauThn7 || 0)) + (t8 * (s.keuangan?.dopTniauThn8 || 0)) + (t9 * (s.keuangan?.dopTniauThn9 || 0));

        totalSiswa += sSiswa; totalRombel += sRombel; totalPendidik += sPendidik; totalTendik += sTendik;
        totalDOPBulan += dopBln;
        totalDOPTahunRutin += dopThn;
      });

      return {
        totalSekolah, totalSiswa, totalRombel, totalPendidik, totalTendik, totalDOPBulan,
        totalDOPTahunRutin, totalDSPPenerimaan,
        grandTotalPenerimaanThn: (totalDOPBulan * 12) + totalDOPTahunRutin,
        rasioGuruSiswa: totalPendidik ? (totalSiswa / totalPendidik).toFixed(1) : 0
      };
    }

        markSchoolDataUpdated(school, "Modul_Identitas", "identitas");
        saveDB(); alert("Berkas berhasil diunggah & disinkronkan ke tab Modul_Identitas!"); renderPage('identitas');

blue text-white font-bold px-5 py-2.5 rounded-xl text-xs">Simpan Modul Siswa</button></div></form>' : '<div>Data Siswa</div>';

div><div class="text-right"><button type="submit" class="bg-brand-blue text-white font-bold px-5 py-2.5 rounded-xl text-xs">Simpan Modul SDM</button></div></form>' : '';

    function renderKeuanganModule(list) {
      const { role } = parseRoleInfo();

      list.forEach(s => {
        const keu = s.keuangan || {};

    function saveKeuanganData(e, npsn) {
      e.preventDefault();
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0];
      const school = db[ta].find(s => s.npsn === npsn);

        markSchoolDataUpdated(school, "Modul_Keuangan", "keuangan");
        saveDB(); alert("Data Keuangan Berhasil Disimpan & Masuk ke Tab Modul_Keuangan!"); renderPage('keuangan');
      }
    }

    function renderDokumenTambahanModule(list) {
      const { role } = parseRoleInfo();
      const isEditable = role === 'SEKOLAH';
      let itemsHtml = '';

      list.forEach(s => {
        const docs = s.dokumenLaporan || {};
        let docsGridHtml = '';
        docsConfig.forEach(doc => {
          const docData = docs[doc.key] || { status: "Belum Mengisi", fileName: "" };
          let uploadHtml = isEditable ? '<div class="pt-2"><input type="file" onchange="uploadDocFile(\'' + s.npsn + '\', \'' + doc.key + '\', this)" class="w-full text-[10px]"></div>' : '';
          docsGridHtml += '<div class="p-3 rounded-xl border bg-white shadow-sm space-y-1"><span class="text-xs font-bold">' + doc.label + '</span><div class="text-[11px]">File: ' + (docData.fileName || '-') + '</div>' + uploadHtml + '</div>';
        });

        itemsHtml += '<div class="bg-white rounded-2xl border shadow-sm p-5 space-y-4"><h4 class="font-bold text-brand-blue text-sm">' + s.nama + '</h4><div class="grid grid-cols-1 md:grid-cols-3 gap-3">' + docsGridHtml + '</div></div>';
      });

      return '<div class="space-y-6"><h3 class="font-bold text-slate-800 text-base">Modul Dokumen & Laporan</h3>' + itemsHtml + '</div>';
    }

    function uploadDocFile(npsn, docKey, inputElem) {
      const taList = Object.keys(db).sort().reverse();
      const ta = document.getElementById('filterTA')?.value || taList[0];
      const school = db[ta].find(s => s.npsn === npsn);
      const fileName = inputElem.files[0] ? inputElem.files[0].name : "Berkas.pdf";
      if (school) {
        if (!school.dokumenLaporan) school.dokumenLaporan = {};
        school.dokumenLaporan[docKey] = { status: "Menunggu Validasi", notes: "", fileName: fileName };
        markSchoolDataUpdated(school, "Modul_Dokumen", "dokumen");
        saveDB(); alert("Berkas laporan berhasil diunggah & Masuk ke Tab Modul_Dokumen!"); renderPage('dokumen_tambahan');
      }
    }

    function renderAnalisisModule(list, stats) {
      return '<div class="bg-white p-6 rounded-2xl border shadow-sm"><h3 class="font-bold text-slate-800 text-base">Analysis & Executive Decision Support</h3></div>';
    }

      return '<div class="bg-white rounded-2xl border shadow-sm p-6"><h3 class="font-bold text-slate-800 text-base">Validasi Pusat</h3></div>';

    function renderLaporanModule(list) {
      return '<div class="bg-white rounded-2xl border shadow-sm p-6"><h3 class="font-bold text-slate-800 text-base">Rekap Laporan</h3></div>';
    }

    function exportToExcel() {
      const list = getFilteredData();
      let csv = "NPSN,Nama Sekolah,Lanud\n";
      list.forEach(s => { csv += '"' + s.npsn + '","' + s.nama + '","' + s.cabang + '"\n'; });
      const blob = new Blob(["\ufeff" + csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a"); link.href = URL.createObjectURL(blob); link.download = "Rekap.csv";
      document.body.appendChild(link); link.click(); document.body.removeChild(link);
    }
  </script>
